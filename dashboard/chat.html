<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地知识库问答 · RAG</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --user:#0ea5e9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:radial-gradient(1000px 500px at 50% -10%,#1e293b,var(--bg)); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 20px; border-bottom:1px solid var(--panel2); }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--muted); font-size:12px; margin-top:4px; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin-bottom:14px; }
  .bubble { display:inline-block; padding:10px 14px; border-radius:14px; max-width:80%; line-height:1.6; font-size:14px; white-space:pre-wrap; }
  .user .bubble { background:var(--user); color:#04263b; border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--panel); border:1px solid var(--panel2); border-bottom-left-radius:4px; }
  .src { font-size:12px; color:var(--muted); margin-top:6px; }
  .src span { background:var(--panel2); padding:2px 8px; border-radius:6px; margin-right:6px; }
  .mode { font-size:11px; color:var(--accent); margin-top:4px; }
  footer { padding:14px 20px; border-top:1px solid var(--panel2); }
  .row { max-width:820px; margin:0 auto; display:flex; gap:10px; width:100%; }
  input { flex:1; background:var(--panel); border:1px solid var(--panel2); color:var(--text); border-radius:10px; padding:12px 14px; font-size:14px; outline:none; }
  button { background:var(--accent); color:#04263b; border:none; border-radius:10px; padding:0 20px; font-weight:600; cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; text-align:center; margin:8px 0; }
  .examples { max-width:820px; margin:0 auto; display:flex; gap:8px; flex-wrap:wrap; }
  .examples button { background:var(--panel2); color:var(--text); font-weight:400; font-size:12px; padding:6px 12px; }
</style>
</head>
<body>
<header>
  <h1>📚 本地知识库问答（RAG）</h1>
  <div class="sub">llm-rag-kb · 自研 BM25 检索 + 抽取式/大模型生成 · 数据不出本机</div>
</header>

<div id="log"></div>

<footer>
  <div class="examples">
    <button data-q="什么是 MQTT？">什么是 MQTT？</button>
    <button data-q="STM32 在物联网终端里做什么？">STM32 在物联网终端里做什么？</button>
    <button data-q="什么是 RAG？">什么是 RAG？</button>
    <button data-q="如何在本地部署大模型？">如何在本地部署大模型？</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <input id="q" placeholder="输入你的问题，回车发送…" autofocus />
    <button id="send">发送</button>
  </div>
</footer>

<script>
const log = document.getElementById('log');
function addMsg(role, html){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML=`<div class="bubble">${html}</div>`; log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
async function ask(text){
  addMsg('user', escapeHtml(text));
  const bot=addMsg('bot','思考中…');
  try{
    const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,topk:5})});
    const j=await r.json();
    let html=escapeHtml(j.answer);
    let src=(j.sources||[]).map(s=>`<span>${escapeHtml(s)}</span>`).join('');
    bot.innerHTML=`<div class="bubble">${html}</div><div class="src">来源：${src||'无'}</div><div class="mode">模式：${j.mode} · 命中 ${j.hits.length} 块</div>`;
  }catch(e){ bot.querySelector('.bubble').textContent='请求失败：'+e; }
  log.scrollTop=log.scrollHeight;
}
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
document.getElementById('send').onclick=()=>{ const v=document.getElementById('q').value.trim(); if(v){ ask(v); document.getElementById('q').value=''; } };
document.getElementById('q').onkeydown=e=>{ if(e.key==='Enter') document.getElementById('send').click(); };
document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script>
</body>
</html>
